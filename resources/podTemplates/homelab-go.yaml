# Pod template for simple Go projects
# Minimal setup for running Go tests and builds
# Includes Athens proxy configuration for caching and private modules
apiVersion: v1
kind: Pod
metadata:
  labels:
    workload-type: ci-builds
    app.kubernetes.io/component: jenkins-agent
spec:
  activeDeadlineSeconds: 3600
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:3355.v388858a_47b_33-3-jdk21
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  - name: go
    image: golang:1.23
    command: ['sleep', '3600']
    env:
    # Go module caching
    - name: GOCACHE
      value: /tmp/go-cache
    - name: GOMODCACHE
      value: /tmp/go-mod
    # Athens Go proxy - caches public modules, handles private github.com/erauner/* modules
    - name: GOPROXY
      value: "https://athens.erauner.dev,direct"
    # Don't verify checksums for private modules (Athens handles this)
    - name: GONOSUMDB
      value: "github.com/erauner/*"
    # Mark as private so Go doesn't try public proxy.golang.org first
    - name: GOPRIVATE
      value: "github.com/erauner/*"
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
